<!doctype html>
<!-- Keep index.html and 404.html identical; GitHub Pages uses 404.html for invitation routes. -->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#003f2b" />
    <base id="siteBase" href="/" />
    <script>
      if (window.location.hostname.endsWith("github.io")) {
        document.querySelector("#siteBase").href = "/Wedding/";
      }
    </script>
    <title>Unsere Hochzeit · Einladung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <div class="paper-grain" aria-hidden="true"></div>

    <main class="experience" aria-labelledby="page-title" hidden>
      <h1 id="page-title" class="sr-only">Hochzeitseinladung von J und C</h1>

      <div class="topline" aria-hidden="true">
        <span></span>
        <p>Eine Einladung von Herzen</p>
        <span></span>
      </div>

      <section class="invitation-stage" aria-label="Interaktive Hochzeitseinladung">
        <div class="book is-closed" id="invitationBook">
          <div class="stationary-page" aria-hidden="true">
            <div class="inside-mark">
              <span>J</span>
              <i>&amp;</i>
              <span>C</span>
            </div>
          </div>

          <button class="cover" id="cover" type="button" aria-label="Einladung öffnen">
            <span class="cover-face cover-front">
              <img
                class="cover-monogram"
                src="assets/monogram.png"
                alt="Monogramm J und C"
              />
              <span class="cover-copy">
                <strong>Wir heiraten</strong>
                <small data-wedding-date>Datum folgt</small>
              </span>
            </span>

            <span class="cover-face cover-back" aria-hidden="true"></span>
          </button>

          <div class="interior" id="interior" aria-live="polite">
            <div class="spine" aria-hidden="true"></div>
            <div class="insert-stack" id="insertStack"></div>
            <div class="pocket-shadow" aria-hidden="true"></div>
            <div class="pocket" aria-hidden="true">
              <img class="pocket-monogram" src="assets/monogram.png" alt="" />
            </div>
          </div>
        </div>
      </section>

      <div class="interaction-bar">
        <p id="interactionHint">Berühre die Karte, um sie zu öffnen …</p>
        <a class="gallery-entry" href="fotos/">Zur Fotogalerie</a>
        <button class="replay-button" id="replayButton" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4v6h6M5.5 9.5A8 8 0 1 1 4 15" />
          </svg>
          Karte schließen
        </button>
      </div>
    </main>

    <dialog
      class="dress-code-dialog"
      id="dressCodeDialog"
      aria-labelledby="dressCodeDialogTitle"
    >
      <div class="dress-code-dialog__inner">
        <button
          class="dress-code-dialog__close"
          id="dressCodeDialogClose"
          type="button"
          aria-label="Erklärung schließen"
        >
          <span aria-hidden="true">×</span>
        </button>

        <p class="dress-code-dialog__eyebrow">Dresscode</p>
        <h2 id="dressCodeDialogTitle">Black Tie Optional</h2>
        <p class="dress-code-dialog__intro">
          Eine formelle Abendgarderobe: Anzug, Abendkleid oder elegantes Cocktailkleid. Fühlt euch wohl und seht dabei stilvoll aus!
        </p>

        <!-- <div class="dress-code-guide">
          <section>
            <h3>Anzug-Look</h3>
            <p>
              Ein Smoking passt perfekt. Genauso passend ist ein dunkler Anzug
              mit weißem Hemd und Krawatte oder Fliege.
            </p>
          </section>
          <section>
            <h3>Kleid-Look</h3>
            <p>
              Ein langes Abendkleid ist willkommen. Auch ein elegantes Midi- oder
              Cocktailkleid passt wunderbar.
            </p>
          </section>
        </div>

        <p class="dress-code-dialog__note">
          Wichtig: „Black Tie“ beschreibt den Grad der Eleganz – eure Kleidung
          muss nicht schwarz sein. Am wichtigsten ist, dass ihr euch wohlfühlt.
        </p> -->
      </div>
    </dialog>

    <noscript>
      <p class="noscript">Bitte aktiviere JavaScript, um die Einladung zu öffnen.</p>
    </noscript>
  </body>
</html>
