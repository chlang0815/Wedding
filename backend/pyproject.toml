[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wedding-gallery-api"
version = "1.0.0"
description = "Private FastAPI backend for a wedding photo gallery"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "pillow-heif>=0.21,<2",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
